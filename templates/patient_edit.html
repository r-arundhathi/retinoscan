
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Patient Account</h2>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label for="name" class="form-label">Patient Name</label>
            <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                value="{{ patient.user.name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ patient.user.email }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                value="{{ patient.phone or '' }}"
            >
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input
                type="number"
                class="form-control"
                id="age"
                name="age"
                min="1"
                max="120"
                value="{{ patient.age if patient.age is not none else '' }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender" required>
                <option value="" {% if not patient.gender %}selected{% endif %}>Select gender</option>
                <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                New Password (optional)
            </label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                minlength="8"
                placeholder="Leave blank to keep the current password"
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('doctor_dashboard') }}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
